[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buattensorart2-helpers"
version = "0.1.3"
description = "Personal helper scripts for myself"
readme = "README.md"
authors = [
    { name = "buattensorart2", email = "buattensorart2@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub==1.26.1",
    "pydantic==2.13.5",
    "tqdm==4.70.0"
]